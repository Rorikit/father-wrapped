<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Demo family memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" filter="url(#grain)" opacity="0.35"/>
  <circle cx="410" cy="355" r="120" fill="#fff" opacity="0.86"/>
  <circle cx="735" cy="355" r="120" fill="#fff" opacity="0.76"/>
  <path d="M240 725c42-170 162-255 312-255s270 85 312 255" fill="#111827" opacity="0.74"/>
  <path d="M520 725c34-136 130-206 250-206s216 70 250 206" fill="#020617" opacity="0.55"/>
  <text x="92" y="115" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="900">Папа Wrapped</text>
  <text x="92" y="180" fill="#ffffff" opacity="0.82" font-family="Arial, sans-serif" font-size="30" font-weight="700">замените это демо-фото своим воспоминанием</text>
</svg>
